name: Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump when the current version is already released"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    concurrency:
      group: windows-release
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Prepare release version
        id: version
        shell: pwsh
        run: |
          $version = (uv version --short).Trim()
          if (-not $version) {
            throw "Could not read project version from pyproject.toml"
          }

          $tag = "v$version"
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # 현재 버전이 이미 릴리즈된 경우에만 다음 버전으로 올린다.
          # 이전 실행이 빌드 중 실패했다면 태그가 없으므로 같은 버전으로 재시도된다.
          if ($existingTag) {
            uv version --bump '${{ inputs.bump }}' --no-sync
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $version = (uv version --short).Trim()
            $tag = "v$version"
            $nextTag = git ls-remote --tags --refs origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            if ($nextTag) {
              throw "Tag $tag already exists. Choose a different version bump."
            }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml uv.lock
            git commit -m "chore: release $tag"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          # github.sha는 워크플로 시작 시점의 커밋이므로 자동 버전 커밋 이후 HEAD를 사용한다.
          $releaseSha = (git rev-parse HEAD).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "Using release tag $tag at $releaseSha"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build EXE
        run: uv run pyinstaller --onefile --noconsole --name "To-do" main.py

      - name: Prepare release asset
        id: package
        shell: pwsh
        run: |
          $assetName = "To-do.exe"
          if (-not (Test-Path -LiteralPath "dist\$assetName")) {
            throw "Release asset dist\$assetName was not found."
          }

          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist\${{ steps.package.outputs.asset_name }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @(
            'release', 'create', '${{ steps.version.outputs.tag }}',
            "dist\${{ steps.package.outputs.asset_name }}",
            '--title', '${{ steps.version.outputs.tag }}',
            '--generate-notes',
            '--target', '${{ steps.version.outputs.release_sha }}'
          )

          if ('${{ inputs.prerelease }}' -eq 'true') {
            $args += '--prerelease'
          }

          & gh @args
